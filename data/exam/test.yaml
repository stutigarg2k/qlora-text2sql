- id: payments_over_5_days_late
  category: date_arithmetic
  question: List the payment references of payments made more than 5 days after the invoice due date.
  sql: |
    SELECT s.reference
    FROM supplier_payments s
    JOIN supplier_invoices i ON s.supplier_invoice_id = i.id
    WHERE julianday(s.payment_date) - julianday(i.due_date) > 5

- id: suppliers_30_day_terms
  category: single_table
  question: Which suppliers have a payment term of 30 days?
  sql: |
    SELECT name FROM suppliers
    WHERE payment_terms_days = 30

- id: orders_in_2024
  category: single_table
  question: How many purchase orders were placed in 2024?
  sql: |
    SELECT COUNT(*) FROM purchase_orders
    WHERE strftime('%Y', order_date) = '2024'

- id: quantity_per_product
  category: aggregate
  question: Show each product description and the total quantity ordered.
  sql: |
    SELECT description, SUM(quantity) AS total_quantity
    FROM purchase_order_lines
    GROUP BY description

- id: hiking_boots_orders
  category: join
  question: "List the PO numbers of orders that include the product \"Hiking Boots - Women's\"."
  sql: |
    SELECT p.po_number
    FROM purchase_orders p
    JOIN purchase_order_lines l ON l.order_id = p.id
    WHERE l.description = 'Hiking Boots - Women''s'



- id: paid_per_supplier
  category: join_aggregate
  question: What is the total amount paid to each supplier?
  sql: |
    SELECT s.name, SUM(p.amount)
    FROM supplier_payments p
    JOIN supplier_invoices i ON p.supplier_invoice_id = i.id
    JOIN suppliers s ON i.supplier_id = s.id
    GROUP BY s.id

- id: invoices_due_march_2025
  category: single_table
  question: List the invoice numbers of invoices with a due date in March 2025.
  sql: |
    SELECT invoice_number FROM supplier_invoices
    WHERE due_date >= '2025-03-01' AND due_date < '2025-04-01'

- id: top_product_by_quantity
  category: aggregate
  question: Which product has the highest total quantity ordered?
  sql: |
    SELECT description
    FROM purchase_order_lines
    GROUP BY description
    ORDER BY SUM(quantity) DESC
    LIMIT 1

- id: average_line_quantity
  category: single_table
  question: What is the average quantity per order line?
  sql: |
    SELECT AVG(quantity) FROM purchase_order_lines

- id: large_orders_with_supplier
  category: join
  question: List the PO number and supplier name of every purchase order with a total amount above 5000.
  sql: |
    SELECT p.po_number, s.name
    FROM purchase_orders p
    JOIN suppliers s ON p.supplier_id = s.id
    WHERE p.total_amount > 5000



