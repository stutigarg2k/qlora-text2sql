- id: unpaid_invoices
  category: single_table
  question: List the invoice numbers of all invoices that have not been paid in full.
  sql: |
    SELECT invoice_number FROM supplier_invoices
    WHERE amount_paid < total_amount

- id: total_po_value
  category: single_table
  question: What is the total value of all purchase orders?
  sql: |
    SELECT SUM(total_amount) FROM purchase_orders

- id: suppliers_no_orders
  category: anti_join
  question: Which suppliers have never been sent a purchase order?
  sql: |
    SELECT s.name FROM suppliers s
    LEFT JOIN purchase_orders p ON p.supplier_id = s.id
    WHERE p.id IS NULL

- id: uninvoiced_pos
  category: anti_join
  question: List the PO numbers of purchase orders that have not been invoiced yet.
  sql: |
    SELECT p.po_number FROM purchase_orders p
    LEFT JOIN supplier_invoices i ON i.po_id = p.id
    WHERE i.id IS NULL

- id: spend_per_supplier
  category: join_aggregate
  question: Show each supplier's name and total purchase order value, highest first.
  sql: |
    SELECT s.name, SUM(p.total_amount) AS total
    FROM purchase_orders p JOIN suppliers s ON p.supplier_id = s.id
    GROUP BY s.id ORDER BY total DESC

- id: late_by_supplier
  category: join_aggregate
  question: For each supplier, how many deliveries arrived after the expected date? Highest first.
  sql: |
    SELECT s.name, COUNT(*) AS late
    FROM goods_receipts g
    JOIN purchase_orders p ON g.po_id = p.id
    JOIN suppliers s ON p.supplier_id = s.id
    WHERE g.receipt_date > p.expected_date
    GROUP BY s.id ORDER BY late DESC

- id: three_days_late
  category: date_arithmetic
  question: List the PO numbers of orders received exactly 3 days after the expected date.
  sql: |
    SELECT p.po_number FROM goods_receipts g
    JOIN purchase_orders p ON g.po_id = p.id
    WHERE julianday(g.receipt_date) - julianday(p.expected_date) = 3

- id: unpaid_invoice_suppliers
  category: join
  question: List the supplier name and invoice number for every invoice not paid in full.
  sql: |
    SELECT s.name, i.invoice_number
    FROM supplier_invoices i JOIN suppliers s ON i.supplier_id = s.id
    WHERE i.amount_paid < i.total_amount